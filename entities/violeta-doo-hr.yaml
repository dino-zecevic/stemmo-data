#
# MEMBERSHIP — TWO MEMBERS, AND NO OWNERSHIP FIELD IS WRITTEN AT ALL.
#   Neither parent nor ultimate_parent appears on this record. That is the
#   whole of what the schema can honestly say here, and the reason follows.
#
#   The register's Osnivači/članovi društva section names TWO members:
#     - VIOLETA d.o.o. za proizvodnju i trgovinu GRUDE, Bosnia and Herzegovina,
#       broj iz registra 64-01-0004-17, JIB 4281104300000, OIB 28271477805 —
#       that is e_violeta_ba, matched on all three register identifiers.
#     - one natural person, who is not named here and must not be added. See
#       "Natural persons are never recorded" in EDITORIAL-POLICY.md.
#   The extract publishes NO percentages for either member, so the register
#   does not say which of the two, if either, controls this company.
#
#   What the register establishes is therefore: e_violeta_ba holds part of this
#   company, and the rest is held by an individual. It does NOT establish that
#   e_violeta_ba owns it, directly or ultimately.
#
#   Both fields are omitted because both would overclaim. parent means "the
#   entity that DIRECTLY owns this one" and ultimate_parent means "the entity at
#   the TOP of the chain"; with two members and no published shares, writing
#   e_violeta_ba into either asserts sole or controlling ownership that this
#   source does not establish. That is the overclaim the four-state ownership
#   model exists to prevent, and that the more plausible of the two candidate
#   values is still an overclaim is exactly the point.
#
#   NO FIELD IN THIS SCHEMA CAN EXPRESS A MEMBER LIST. That is the README's open
#   question "How should a company with several members be recorded?", and this
#   record is its first real instance in the data rather than a hypothetical.
#   The fact is not lost — it is stated above, sourced, and converts to a field
#   the moment the schema can carry one. If that question is ever resolved, this
#   is the first record to revisit.
#
#   What would settle it instead: a share breakdown, from the register's own
#   documents (društveni ugovor / capital history) rather than the summary page.
#   Nobody has looked for one.
#
