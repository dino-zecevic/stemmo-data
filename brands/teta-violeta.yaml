# SCOPE. Class 03 covers proizvodi za čišćenje and, explicitly, tekućine za
#   pranje automobilskih stakala — cleaning products and glass-washing liquids,
#   which is exactly this product. Class 16 covers paper goods. This is a
#   COMBINED mark (Vienna codes 27.05.xx and 29.01.05, violet), not a word mark.
#
# TETA VIOLETA IS A SEPARATE BRAND FROM VIOLETA. The trade mark is for TETA
#   VIOLETA specifically, and the register was searched for it as such. Do not
#   merge this record with any future Violeta brand record: the producer sells
#   nappies and paper goods under other marks, and the owner being the same
#   company does not make the marks the same brand.
#
# THE OWNER IS IDENTIFIED BY NAME AND ADDRESS, NOT BY A REGISTRATION NUMBER.
#   TMview trade mark records carry no company registration number. The mark
#   names Violeta d.o.o., Kolo bb, Tomislavgrad — the FORMER seat of the company
#   recorded as e_violeta_ba. The chain joining the two, stated here so a
#   reviewer can check it rather than take it on trust:
#     mark names Violeta d.o.o., Kolo bb, Tomislavgrad
#       -> the Croatian register's capital history names VIOLETA d.o.o. za
#          proizvodnju i trgovinu TOMISLAVGRAD, Kolo bb, under OIB 28271477805
#       -> the same Croatian register identifies the BiH member company by
#          OIB 28271477805 together with MBS 64-01-0004-17 and JIB 4281104300000
#       -> those are the register identifiers of e_violeta_ba.
#   Set out in full in entities/violeta-doo-ba.yaml.
#
# THE REGISTRATION APPEARS TO HAVE LAPSED — DATA QUALITY FLAG. Expiry is
#   recorded as 2026-05-20, which has passed, and TMview shows no renewal. The
#   status field still reads Registered. TMview's own notice states that it is
#   not an official register and its contents have no legal effect, so the
#   absence of a renewal there is not proof that none was filed. The IIP-BIH
#   register itself would settle it and has not been consulted.
#   An expired registration does not by itself mean the company stopped owning
#   the brand. It means this citation is weaker than a live one. The claim
#   recorded here is that this company owned the mark; the source is dated and
#   its condition is stated.
#
# No TMview URL is cited: TMview puts the record id in a hash fragment, which a
#   server never sees, so a constructed URL cannot be verified as resolving.

