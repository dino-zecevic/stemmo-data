# SCOPE. Class 16 lists toaletni papir explicitly, which is exactly the product
#   this brand is used for here. The mark also covers class 03 (detergents and
#   cleaning preparations), class 05 (nappies and hygiene products), class 21
#   (dispensers and holders) and class 35 (retail and advertising services) —
#   between them, the producer's full range rather than one product line.
#   This is a COMBINED mark (Vienna codes 26.01.xx, 27.05.xx), not a word mark.
#
# THE OWNER IS IDENTIFIED BY NAME AND ADDRESS, AND NO CHAIN IS NEEDED. The mark
#   names VIOLETA d.o.o., Stjepana Radića 21, 88340 Grude — which is the current
#   register address of e_violeta_ba, matching exactly. Unlike
#   brands/teta-violeta.yaml, whose mark was filed from the company's FORMER
#   Tomislavgrad seat and needs a chain through the Croatian register's capital
#   history to attribute, this one attaches directly. Nothing is inferred.
#
# VIOLETA AND TETA VIOLETA ARE TWO SEPARATE MARKS, and this record confirms the
#   warning in brands/teta-violeta.yaml rather than contradicting it:
#     1619857  VIOLETA        filed 2016-11-18, classes 03/05/16/21/35
#     1619510  TETA VIOLETA   filed 2016-05-20, classes 03/16
#   Two marks, filed six months apart, with overlapping but different class
#   sets, both owned by the same company. That the owner is the same is exactly
#   why the distinction has to be kept: a company registering two marks
#   separately is a company treating them as two brands, and merging them here
#   would discard a decision the trademark register records.
#
# THE REGISTRATION EXPIRES 2026-11-18 — roughly two months from the date below,
#   with no renewal recorded in TMview. This citation is about to weaken, and
#   should be re-checked after that date. TMview is not an official register and
#   says so itself, so the absence of a renewal there is not proof that none was
#   filed; the IIP-BIH register would settle it and has not been consulted. The
#   same flag stands, already past its date, on brands/teta-violeta.yaml.
#   An expired registration does not mean the company stopped owning the brand.
#   It means the citation is weaker than a live one, and its condition is stated.
#
# No TMview URL is cited: TMview puts the record id in a hash fragment, which a
# server never sees, so a constructed URL cannot be verified as resolving.

id: b_violeta
name: Violeta

brand_owner: e_violeta_ba

