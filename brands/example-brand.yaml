# EXAMPLE FILE — this brand does not exist.
# It is here as a template. Copy it, replace every value, and delete this header.
# One brand per file. A brand is a name printed on a product, not a company.

id: b_example_brand               # slug, prefix b_, lowercase, underscores
name: Example Brand               # the brand name as it is normally written

# Alternative spellings a product database might use. Optional, but this is what
# makes matching work across languages and markets. Record the forms you have
# actually seen in use, including local-language and transliterated ones.
aliases:
  - ExampleBrand
  - Example Brand Classic
  - Example Brand Original

# The entity that owns the trademark. Must be an id present in entities/.
brand_owner: e_example_holding_ltd

sources:
  - https://example.com/trademarks/example-brand   # trademark register entry for the mark
  - https://example.com/about/our-brands           # official company website

verified_on: 2026-09-15

example: true
