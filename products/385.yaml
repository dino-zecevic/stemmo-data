# THE FILENAME IS A FILING CONVENTION. IT IS NOT A COUNTRY.
#
# Entries live in the file named after the first three digits of the barcode as
# written in the record. That is all the filename means.
#
# Those digits record which GS1 member organisation issued the number. They say
# nothing about where the product was made, who made it, or where the company is
# registered, and EDITORIAL-POLICY.md forbids drawing any such conclusion from
# them. Read the markets: records for origin; read nothing into this filename.
#
# The convention exists because it sorts the records and keeps two contributors
# working on different products out of the same file. Nothing more.
#
# See products/README.md for what these records are and how they are shaped.

- barcode: "3856028503835"
  name: Jana prirodna mineralna voda / natural mineral water, negazirana, 0,5 l
  brand: b_jana

  markets:
    - market: BA
      made_in: HR
      operator: e_jamnica_plus
      placed_on_market_by: e_sarajevski_kiseljak    # importer for BiH
      sources:
        - "label text: Proizvedeno u Hrvatskoj"
        - "label text: Proizvodi i puni: Jamnica plus d.o.o., Vladimira Nazora 57, 10451 Pisarovina, Hrvatska"
        - "label text: Uvoznik za BiH: Sarajevski Kiseljak d.o.o., Kraljice mira 7, 71250 Kiseljak"
      verified_on: 2026-09-16

# The pack is branded Violeta PREMIUM. PREMIUM is a range within the Violeta
#   brand, not a brand of its own, so it is carried in the product name — the
#   same way Naše is handled under Bingo. See "Sub-brands do not get their own
#   file" in CONTRIBUTING.md.
# b_violeta, not b_teta_violeta. The mark cited on b_violeta (IIP-BIH 1619857)
#   covers class 16, which lists toaletni papir explicitly. b_teta_violeta is a
#   different mark, 1619510, for a different brand owned by the same company,
#   and that file says in terms that the two must not be merged. It is
#   deliberately not used here.
- barcode: "3859892288051"
  name: Violeta PREMIUM toaletni papir, 16 rolni
  brand: b_violeta

  markets:
    - market: BA
      made_in: BA
      operator: e_violeta_ba
      sources:
        - "label text: Zemlja porijekla: Bosna i Hercegovina"
        - "label text: Proizvođač: Violeta d.o.o., Stjepana Radića 21, 88340 Grude, BiH"
      verified_on: 2026-09-17
