# THE FILENAME IS A FILING CONVENTION. IT IS NOT A COUNTRY.
#
# Entries live in the file named after the first three digits of the barcode as
# written in the record. That is all the filename means.
#
# Those digits record which GS1 member organisation issued the number. They say
# nothing about where the product was made, who made it, or where the company is
# registered, and EDITORIAL-POLICY.md forbids drawing any such conclusion from
# them. Read the markets: records for origin; read nothing into this filename.
#
# The convention exists because it sorts the records and keeps two contributors
# working on different products out of the same file. Nothing more.
#
# See products/README.md for what these records are and how they are shaped.

- barcode: "90490705"
  name: Fanta Tropicool 0,5 L
  brand: b_fanta

  markets:
    # No placed_on_market_by for BA: the label names no party separate from the
    #   bottler for BiH.
    - market: BA
      made_in: BA
      operator: e_cchbc_bh
      sources:
        - "label text: Po ovlaštenju The Coca-Cola Company proizvodi Coca-Cola HBC B-H d.o.o. Sarajevo"
      verified_on: 2026-09-23

    # The bottle was bought in BiH; this record rests on the same label, which
    #   names Coca-Cola HBC Hrvatska for HR. The contributor reads that line as
    #   naming the producer for the Croatian market rather than an importer, and
    #   operator is recorded on that reading. The line itself has not been
    #   transcribed verbatim, and no country of manufacture for HR is stated, so
    #   made_in is left out. Transcribe the HR line exactly when next checked.
    - market: HR
      made_in: HR
      operator: e_cchbc_hr
      sources:
        - "label text, summarised rather than transcribed: the pack names Coca-Cola HBC Hrvatska d.o.o. for HR"
      verified_on: 2026-09-23

# The label prints one production line for both markets, headed "HR/BiH".
#   made_in HR rests on the contributor's reading of the pack that it is made in
#   Croatia; the country line itself has not been transcribed verbatim.
#   Transcribe it exactly when next checked.
- barcode: "90492341"
  name: Cappy 100% Orange 330 ml
  brand: b_cappy

  markets:
    - market: BA
      made_in: HR
      operator: e_cchbc_hr
      placed_on_market_by: e_cchbc_bh    # importer for BiH
      sources:
        - "label text: HR/BiH: Temeljem odobrenja The Coca-Cola Company proizvodi Coca-Cola HBC Hrvatska."
        - "label text, summarised rather than transcribed: made in Croatia"
        - "label text: Uvoznik za BiH: Coca Cola BH."
      verified_on: 2026-09-23

    # No placed_on_market_by for HR: the producer is the Croatian company, and
    #   the label names no separate party for HR.
    - market: HR
      made_in: HR
      operator: e_cchbc_hr
      sources:
        - "label text: HR/BiH: Temeljem odobrenja The Coca-Cola Company proizvodi Coca-Cola HBC Hrvatska."
        - "label text, summarised rather than transcribed: made in Croatia"
      verified_on: 2026-09-23
