name: validate

# Runs scripts/validate.py: schemas, file locations, no comments, and every id
# a record points at must exist. Contributors can run the same script locally.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/validate.py
